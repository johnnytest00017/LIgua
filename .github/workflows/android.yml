name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Accept Android SDK licenses (SDK is preinstalled on runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      # Same signing key on every build, so a new APK installs over the old one and the downloaded models are kept.
      - name: Use the fixed debug signing key
        run: mkdir -p ~/.android && cp signing/debug.keystore ~/.android/debug.keystore
      - name: Install packages (retries if a download hiccups)
        run: |
          npm install --ignore-scripts
          npm rebuild esbuild || true
          npm rebuild sharp || echo "sharp could not be installed: the app icon will be the default one"
      - run: test -d android || npx cap add android
      - run: npm run assets -- --android || true
      # No models are bundled any more: the app downloads its translator and AI after install.
      - name: Build the on-phone translator engine
        run: npm run build:web
      - run: npx cap sync android
      - name: Add Back-button + Media-folder support to the Android project
        run: bash scripts/patch-android.sh
      - name: Install the on-phone AI engine
        run: node scripts/patch-llm.mjs
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: safina-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
